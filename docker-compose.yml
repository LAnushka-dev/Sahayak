version: '3.8'

services:
  fastapi-backend:
    build: .
    container_name: sahayak_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+pymysql://sahayak_user:sahayak_pass@mysql-db:3306/sahayak_db
      - NEO4J_URI=bolt://neo4j-graph:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password123
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - JINA_API_KEY=${JINA_API_KEY:-}
      - SERPER_API_KEY=${SERPER_API_KEY:-}
    depends_on:
      mysql-db:
        condition: service_healthy
      neo4j-graph:
        condition: service_started
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000

  gradio-ui:
    build: .
    container_name: sahayak_demo
    ports:
      - "7860:7860"
    environment:
      - DATABASE_URL=mysql+pymysql://sahayak_user:sahayak_pass@mysql-db:3306/sahayak_db
      - NEO4J_URI=bolt://neo4j-graph:7687
    depends_on:
      - fastapi-backend
    command: python demo/app_gradio.py

  mysql-db:
    image: mysql:8.0
    container_name: sahayak_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: sahayak_db
      MYSQL_USER: sahayak_user
      MYSQL_PASSWORD: sahayak_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j-graph:
    image: neo4j:5.18-community
    container_name: sahayak_neo4j
    restart: always
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password123
    volumes:
      - neo4j_data:/data

volumes:
  mysql_data:
  neo4j_data:
