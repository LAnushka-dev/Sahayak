name: Sahayak CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Intent Classifier & Baseline Benchmark
      run: |
        python ml/train_classifier.py

    - name: Run Knowledge Graph Seeding Check
      run: |
        python graph/seed_graph.py

    - name: Run RAGAS Pipeline Benchmark
      run: |
        python eval/run_ragas.py

    - name: Verify Backend Server Initialization
      run: |
        python -c "from backend.main import app; print('FastAPI app initialized successfully.')"
